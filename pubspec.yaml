name: smart_montage
description: Smart video montage maker with automatic highlights, transitions and styles.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  ffmpeg_kit_flutter_new_video: ^2.5.7
  flutter_foreground_task: ^8.13.0
  video_player: ^2.9.5
  gal: ^2.3.0
  file_picker: ^8.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true